[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "perturbalign"
version = "0.9.2"
description = "Single-cell perturbation alignment, causal knowledge graph enrichment, and UPDS standardization middleware."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "aaronredzsir-star" }]
keywords = ["perturb-seq", "single-cell", "drug", "normalization", "annotation", "causal-graph", "knowledge-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Core module only depends on standard library (sqlite3/urllib/dataclasses); pandas/rapidfuzz/rdkit/anndata are optional
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
fuzzy = ["rapidfuzz>=2.0"]
rdkit = ["rdkit>=2023.3"]
anndata = ["anndata>=0.8"]
dev = ["pytest>=7.0", "pandas>=1.5", "rapidfuzz>=2.0"]

[project.urls]
Homepage = "https://github.com/aaronredzsir-star/perturbalign"
Repository = "https://github.com/aaronredzsir-star/perturbalign"
"Bug Tracker" = "https://github.com/aaronredzsir-star/perturbalign/issues"

[project.scripts]
perturbalign = "perturbalign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"perturbalign" = ["resources/*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
